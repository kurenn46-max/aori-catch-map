name: Discover aori source candidates
on:
  workflow_dispatch:
  schedule:
    - cron: "23 21 * * *"
  push:
    branches:
      - main
      - "v4/**"
    paths:
      - "scripts/discover_sources.py"
      - ".github/workflows/discover-sources.yml"
      - "data/source-registry.json"
permissions:
  contents: write
concurrency:
  # Serialize with all generated-data writers so source-candidate commits
  # cannot race catches/archive/tide/strategy commits on main.
  group: aori-catch-collector
  cancel-in-progress: false
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Sync latest branch before generating data
        run: |
          git fetch origin "$GITHUB_REF_NAME"
          git merge --ff-only "origin/$GITHUB_REF_NAME"
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install --disable-pip-version-check requests beautifulsoup4
      - name: Syntax check
        run: python -m py_compile scripts/discover_sources.py
      - name: Discover and verify candidate sources
        run: python scripts/discover_sources.py
      - name: Validate candidate queue
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("data/source-candidates.json").read_text(encoding="utf-8"))
          assert d["query_count"] == 30
          assert d["query_ok"] >= 20
          rows=d.get("candidates",[])
          assert rows
          site_keys=[x.get("site_key") for x in rows]
          assert len(site_keys) == len(set(site_keys)), "duplicate source candidates by site_key"
          for x in rows:
              for k in ("id","region","url","domain","score","tier","status","site_key"):
                  assert x.get(k) not in (None,""), (k,x)
              assert x["tier"] in ("A","B","C")
              assert x.get("auto_promote") is False
              if x["tier"] in ("A","B"):
                  assert x.get("verified") is True, x
                  assert x.get("region_explicit") is True, x
              if x["tier"] == "A":
                  assert x.get("page_direct_identity") is True, x
                  assert x.get("source_type") != "aggregator", x
          print("candidate queue PASS",len(rows),d.get("tier_counts"))
          PY
      - name: Commit candidate queue
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/source-candidates.json
          if git diff --cached --quiet; then
            echo "No candidate changes"
            exit 0
          fi
          git commit -m "Update aori source candidates"
          git push origin HEAD:"$GITHUB_REF_NAME"
