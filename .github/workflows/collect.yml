name: Collect aori catches
on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/collect.py"
      - "scripts/collect_public_signals.py"
      - "scripts/build_strategy.py"
      - "scripts/archive_and_summary.py"
      - "scripts/build_tide_patterns.py"
      - ".github/workflows/collect.yml"
      - "data/source-registry.json"
      - "data/intel.json"
  schedule:
    - cron: "17 */6 * * *"
permissions:
  contents: write
concurrency:
  # Shared with archive-summary so generated JSON writers never race.
  group: aori-catch-collector
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install collector dependencies
        run: pip install --disable-pip-version-check requests beautifulsoup4
      - name: Syntax check
        run: python -m py_compile scripts/collect.py scripts/collect_public_signals.py scripts/archive_and_summary.py scripts/build_tide_patterns.py scripts/build_strategy.py
      - name: Collect direct catches and source health
        run: python scripts/collect.py
      - name: Collect multi-source public signals
        run: python scripts/collect_public_signals.py --output data/discovery-signals.json
      - name: Rebuild permanent archive and trends
        run: python scripts/archive_and_summary.py
      - name: Rebuild tide patterns
        run: python scripts/build_tide_patterns.py
      - name: Build eging strategy signals
        run: python scripts/build_strategy.py
      - name: Validate generated JSON
        run: |
          python - <<'PY'
          import json
          from datetime import date, timedelta
          from pathlib import Path

          paths = [
              "data/catches.json",
              "data/source-status.json",
              "data/discovery-signals.json",
              "data/summary.json",
              "data/archive/2026.json",
              "data/tide-patterns.json",
              "data/strategy.json",
          ]
          for p in paths:
              json.loads(Path(p).read_text(encoding="utf-8"))

          catches = json.loads(Path("data/catches.json").read_text(encoding="utf-8")).get("catches", [])
          ids = [x.get("id") for x in catches if x.get("id")]
          if len(ids) != len(set(ids)):
              raise SystemExit("duplicate catch ids detected")
          future_limit = (date.today() + timedelta(days=1)).isoformat()
          for x in catches:
              for key in ("id", "date", "area", "type", "source", "url"):
                  if not x.get(key):
                      raise SystemExit(f"missing {key}: {x}")
              if x["date"] > future_limit:
                  raise SystemExit(f"future catch date: {x['date']} {x['id']}")
          discovery = json.loads(Path("data/discovery-signals.json").read_text(encoding="utf-8"))
          signals = discovery.get("signals", [])
          signal_ids = [x.get("id") for x in signals if x.get("id")]
          if len(signal_ids) != len(set(signal_ids)):
              raise SystemExit("duplicate discovery signal ids detected")
          for x in signals:
              for key in ("id", "date", "source", "url", "confidence", "quality_score"):
                  if x.get(key) in (None, ""):
                      raise SystemExit(f"missing discovery {key}: {x}")
              if x.get("usable_for_decision"):
                  if x.get("confidence") not in ("A", "B"):
                      raise SystemExit(f"untrusted grade marked usable: {x}")
                  if not x.get("area") or x.get("type") not in ("shore", "boat", "raft"):
                      raise SystemExit(f"incomplete signal marked usable: {x}")
              has_depth = bool(x.get("depth_m") or x.get("bottom_offset_m") or x.get("tana_m"))
              if has_depth and x.get("depth_confidence") not in ("A", "B"):
                  raise SystemExit(f"depth signal lacks confidence: {x}")
              if x.get("count_mentions") and x.get("count_confidence") != "mention_only":
                  raise SystemExit(f"catch-count mention treated as authoritative: {x}")
          trusted = sum(bool(x.get("usable_for_decision")) for x in signals)

          strategy = json.loads(Path("data/strategy.json").read_text(encoding="utf-8"))
          for area in strategy.get("areas", []):
              sources = int(area.get("sources_30d", 0))
              if sources < 2 and area.get("grade") == "A":
                  raise SystemExit(f"single-source area incorrectly graded A: {area.get('area')}")
              if "evidence" not in area:
                  raise SystemExit(f"strategy evidence missing: {area.get('area')}")
          print(f"validated catches={len(catches)} discovery={len(signals)} trusted={trusted} strategy_areas={len(strategy.get('areas', []))}")
          PY
      - name: Commit generated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/catches.json data/source-status.json data/discovery-signals.json data/archive data/summary.json data/tide-patterns.json data/strategy.json
          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git commit -m "Update aori catch data and health"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin HEAD:"$GITHUB_REF_NAME"
