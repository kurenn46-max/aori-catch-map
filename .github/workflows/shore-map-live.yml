name: Verify live shore map
on:
  workflow_run:
    workflows: ["Deploy GitHub Pages"]
    types: [completed]
    branches: [main]
permissions:
  contents: read
jobs:
  live-mobile:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install real-browser test tools
        run: |
          npm install --no-save playwright@1.56.0
          npx playwright install chromium --with-deps
      - name: Check published HTTPS URL
        run: curl -fsSL --retry 5 --retry-delay 4 --retry-all-errors https://kurenn46-max.github.io/aori-catch-map/shore-map/ -o /tmp/shore-live.html
      - name: Verify deployed map in Android-sized browser
        env:
          TEST_URL: https://kurenn46-max.github.io/aori-catch-map/shore-map/
        run: node tests/shore-map-smoke.cjs
      - name: Save live-site screenshots and results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shore-map-live-mobile-test
          path: test-results/
          if-no-files-found: warn
