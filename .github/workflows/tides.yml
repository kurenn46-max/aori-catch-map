name: Update JMA tides
on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/update_tides.py"
      - ".github/workflows/tides.yml"
  schedule:
    - cron: "21 15 * * *"
permissions:
  contents: write
jobs:
  tides:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python scripts/update_tides.py
      - name: Commit tide cache
        run: |
          if git diff --quiet -- data/tides.json; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/tides.json
          git commit -m "Update JMA tide cache"
          git pull --rebase origin main
          git push
