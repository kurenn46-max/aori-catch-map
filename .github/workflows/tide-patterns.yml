name: Build tide patterns
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "data/archive/2026.json"
      - "data/tides.json"
      - "scripts/build_tide_patterns.py"
      - ".github/workflows/tide-patterns.yml"
permissions:
  contents: write
concurrency:
  group: aori-catch-collector
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Sync latest branch before generating data
        run: |
          git fetch origin "$GITHUB_REF_NAME"
          git merge --ff-only "origin/$GITHUB_REF_NAME"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/build_tide_patterns.py
      - name: Commit patterns
        run: |
          if [ -z "$(git status --porcelain -- data/tide-patterns.json)" ]; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/tide-patterns.json
          git commit -m "Rebuild historical tide patterns"
          git push origin HEAD:"$GITHUB_REF_NAME"
