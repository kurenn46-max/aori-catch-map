name: Probe web search engines
on:
  workflow_dispatch:
  push:
    branches: ["feat/keyword-discovery-*"]
    paths:
      - "scripts/search_engine_probe.py"
      - ".github/workflows/search-engine-probe.yml"
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install --disable-pip-version-check requests beautifulsoup4
      - run: python -m py_compile scripts/search_engine_probe.py
      - run: python scripts/search_engine_probe.py
