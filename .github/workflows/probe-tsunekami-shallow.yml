name: Probe Tsunekami shallow datasets
on:
  push:
    branches: ['research/tsunekami-shallow-v2']
    paths:
      - 'scripts/probe_tsunekami_shallow.py'
      - '.github/workflows/probe-tsunekami-shallow.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  shallow:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - name: Query shallow depth and seabed data
        run: python3 scripts/probe_tsunekami_shallow.py
      - name: Save responses for review
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tsunekami-shallow-source-results
          path: probe-shallow/
          retention-days: 7
