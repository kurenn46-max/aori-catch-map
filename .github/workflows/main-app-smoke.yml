name: Main app Android smoke test
on:
  push:
    branches:
      - main
      - 'test/**'
      - 'fix/**'
      - 'perf/**'
      - 'feat/source-discovery-v2-*'
      - 'v4/**'
    paths:
      - 'index.html'
      - 'data/**'
      - 'tests/main-app-smoke.cjs'
      - '.github/workflows/main-app-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mobile-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright browser
        run: |
          npm install --no-save playwright@1.56.0
          npx playwright install chromium --with-deps
      - name: Bundle Leaflet locally for root app
        run: |
          npm install --prefix /tmp/main-map-deps --no-save --no-audit --no-fund leaflet@1.9.4
          mkdir -p assets
          cp /tmp/main-map-deps/node_modules/leaflet/dist/leaflet.js assets/leaflet.js
          cp /tmp/main-map-deps/node_modules/leaflet/dist/leaflet.css assets/leaflet.css
          cp -r /tmp/main-map-deps/node_modules/leaflet/dist/images assets/images
      - name: Install V4 collector dependencies
        run: pip install --disable-pip-version-check requests beautifulsoup4
      - name: Rebuild V4 live feed and validate strategy for current JST day
        run: |
          python3 -m py_compile scripts/v4_collect_hot.py scripts/v4_build_feed.py scripts/build_strategy.py
          python3 scripts/v4_collect_hot.py
          python3 scripts/v4_build_feed.py
          python3 scripts/build_strategy.py
          python3 - <<'PY'
          import json
          from datetime import datetime, timedelta, timezone
          from pathlib import Path
          j=json.loads(Path("data/strategy.json").read_text(encoding="utf-8"))
          today=datetime.now(timezone(timedelta(hours=9))).strftime("%Y-%m-%d")
          assert j.get("reference_date")==today, (j.get("reference_date"), today)
          assert any((x.get("shore_context") or {}).get("last7_signals",0) for x in j.get("areas",[])), "shore_context missing trusted shore signals"
          live=json.loads(Path("data/live-feed.json").read_text(encoding="utf-8"))
          rows=live.get("catches",[])
          supp=[x for x in rows if x.get("supplementary")]
          assert live.get("version")==4
          assert supp, "trusted public evidence missing from V4 live feed"
          assert all(x.get("count") is None for x in supp), "supplementary rows invented catch counts"
          assert any(x.get("date")=="2026-10-06" and x.get("type")=="shore" for x in rows), "known 10/6 shore signal missing"
          print("strategy reference", j.get("reference_date"), "V4 live", live.get("counts"), "supplementary", len(supp))
          PY
      - name: Start local site
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/aori-http.log 2>&1 &
          sleep 2
          curl -fsS http://127.0.0.1:8765/ > /dev/null
      - name: Test root app in Android-sized browser
        run: node tests/main-app-smoke.cjs
      - name: Save screenshots and report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: main-app-mobile-test
          path: test-results/
          if-no-files-found: warn
