name: Main app Android smoke test
on:
  push:
    branches:
      - 'test/aori-main-audit-20261005'
    paths:
      - 'index.html'
      - 'data/**'
      - 'tests/main-app-smoke.cjs'
      - '.github/workflows/main-app-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mobile-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright browser
        run: |
          npm install --no-save playwright@1.56.0
          npx playwright install chromium --with-deps
      - name: Start local site
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/aori-http.log 2>&1 &
          sleep 2
          curl -fsS http://127.0.0.1:8765/ > /dev/null
      - name: Test root app in Android-sized browser
        run: node tests/main-app-smoke.cjs
      - name: Save screenshots and report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: main-app-mobile-test
          path: test-results/
          if-no-files-found: warn
