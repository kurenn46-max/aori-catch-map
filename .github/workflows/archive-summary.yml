name: Archive and summarize catches
on:
  push:
    paths:
      - "data/catches.json"
permissions:
  contents: write
concurrency:
  group: aori-catch-collector
  cancel-in-progress: false
jobs:
  archive:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Sync latest branch before generating data
        run: |
          git fetch origin "$GITHUB_REF_NAME"
          git merge --ff-only "origin/$GITHUB_REF_NAME"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/archive_and_summary.py
      - run: python scripts/build_tide_patterns.py
      - run: python scripts/build_strategy.py
      - name: Commit archive summary and tide patterns
        run: |
          if [ -z "$(git status --porcelain -- data/archive data/summary.json data/tide-patterns.json data/strategy.json)" ]; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/archive data/summary.json data/tide-patterns.json data/strategy.json
          git commit -m "Archive catches and rebuild trends"
          git push origin HEAD:"$GITHUB_REF_NAME"
