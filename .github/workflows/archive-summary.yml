name: Archive and summarize catches
on:
  push:
    paths:
      - "data/catches.json"
permissions:
  contents: write
jobs:
  archive:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/archive_and_summary.py
      - name: Commit archive and summary
        run: |
          if git diff --quiet -- data/archive data/summary.json; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/archive data/summary.json
          git commit -m "Archive catches and rebuild trends"
          git pull --rebase origin main
          git push
