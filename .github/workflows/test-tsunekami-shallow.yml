name: Verify private shallow import before release
on:
  push:
    branches: ['research/tsunekami-shallow-v2']
    paths:
      - 'tsunekami-map/**'
      - 'tests/tsunekami-map-smoke.cjs'
      - '.github/workflows/test-tsunekami-shallow.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Android-sized browser and pinned local Leaflet
        run: |
          npm install --no-save playwright@1.56.0
          npx playwright install chromium --with-deps
          npm install --prefix /tmp/leaflet-for-map --no-save --no-audit --no-fund leaflet@1.9.4
          mkdir -p shore-map/assets
          cp /tmp/leaflet-for-map/node_modules/leaflet/dist/leaflet.js shore-map/assets/leaflet.js
          cp /tmp/leaflet-for-map/node_modules/leaflet/dist/leaflet.css shore-map/assets/leaflet.css
          cp -r /tmp/leaflet-for-map/node_modules/leaflet/dist/images shore-map/assets/images
      - name: Start local website
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/tsunekami-shallow.log 2>&1 &
          sleep 2
          curl -fsS http://127.0.0.1:8765/tsunekami-map/ >/dev/null
      - name: Verify real 20m/50m and test-only private 2m/5m/10m import
        run: node tests/tsunekami-map-smoke.cjs
      - name: Upload diagnostic screenshots and results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tsunekami-shallow-android-test
          path: test-results/tsunekami/
          retention-days: 7
