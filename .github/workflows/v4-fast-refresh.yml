name: V4 fast shore refresh
on:
  workflow_dispatch:
  schedule:
    - cron: "7,37 * * * *"
  push:
    branches:
      - "v4/**"
    paths:
      - "scripts/v4_collect_hot.py"
      - "scripts/v4_build_feed.py"
      - "scripts/collect.py"
      - "scripts/collect_public_signals.py"
      - ".github/workflows/v4-fast-refresh.yml"
      - "index.html"

permissions:
  contents: write

concurrency:
  # Serialize with the legacy/deep collector until V4 fully replaces it.
  group: aori-catch-collector
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Sync latest branch
        run: |
          git fetch origin "$GITHUB_REF_NAME"
          git merge --ff-only "origin/$GITHUB_REF_NAME"
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Install dependencies
        run: pip install --disable-pip-version-check requests beautifulsoup4
      - name: Syntax check
        run: |
          python -m py_compile             scripts/collect.py             scripts/collect_public_signals.py             scripts/v4_collect_hot.py             scripts/v4_build_feed.py
      - name: Direct catch refresh
        run: python scripts/collect.py
      - name: Fast shore refresh
        run: python scripts/v4_collect_hot.py
      - name: Build canonical live feed
        run: python scripts/v4_build_feed.py
      - name: Validate V4 feed
        run: |
          python - <<'PY'
          import json
          from datetime import datetime, timedelta, timezone
          from pathlib import Path

          feed=json.loads(Path("data/live-feed.json").read_text(encoding="utf-8"))
          health=json.loads(Path("data/v4-health.json").read_text(encoding="utf-8"))
          assert feed.get("version")==4
          rows=feed.get("catches",[])
          assert rows, "empty live-feed"
          ids=[x.get("id") for x in rows]
          assert len(ids)==len(set(ids)), "duplicate live-feed ids"
          assert any(x.get("type")=="shore" for x in rows), "no shore rows"
          for x in rows:
              for k in ("id","date","area","type","source","url","evidence_confidence","feed_origin"):
                  assert x.get(k) not in (None,""), (k,x)
              assert x["type"] in ("shore","boat")
              assert x["evidence_confidence"] in ("A","B")
              if x.get("supplementary"):
                  assert x.get("count") is None, x
                  assert x.get("precision")=="area", x
          assert health.get("target_hot_refresh_minutes")==30
          print("V4 PASS", feed.get("counts"), health.get("coverage"))
          PY
      - name: Commit live data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/catches.json data/source-status.json data/v4-hot-signals.json data/live-feed.json data/v4-health.json
          if git diff --cached --quiet; then
            echo "No V4 data changes"
            exit 0
          fi
          git commit -m "Refresh V4 live aori feed"
          git push origin HEAD:"$GITHUB_REF_NAME"
