name: Deploy GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_run:
    workflows: ["Collect aori catches"]
    types: [completed]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Bundle Leaflet locally for shore map
        run: |
          npm install --prefix /tmp/shore-map-deps --no-save --no-audit --no-fund leaflet@1.9.4
          mkdir -p shore-map/assets
          cp /tmp/shore-map-deps/node_modules/leaflet/dist/leaflet.js shore-map/assets/leaflet.js
          cp /tmp/shore-map-deps/node_modules/leaflet/dist/leaflet.css shore-map/assets/leaflet.css
          cp -r /tmp/shore-map-deps/node_modules/leaflet/dist/images shore-map/assets/images
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
