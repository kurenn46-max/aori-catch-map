name: Deploy GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_run:
    workflows: ["Collect aori catches"]
    types: [completed]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Bundle Leaflet locally for root and shore maps
        run: |
          npm install --prefix /tmp/map-deps --no-save --no-audit --no-fund leaflet@1.9.4
          mkdir -p assets shore-map/assets
          cp /tmp/map-deps/node_modules/leaflet/dist/leaflet.js assets/leaflet.js
          cp /tmp/map-deps/node_modules/leaflet/dist/leaflet.css assets/leaflet.css
          cp -r /tmp/map-deps/node_modules/leaflet/dist/images assets/images
          cp /tmp/map-deps/node_modules/leaflet/dist/leaflet.js shore-map/assets/leaflet.js
          cp /tmp/map-deps/node_modules/leaflet/dist/leaflet.css shore-map/assets/leaflet.css
          cp -r /tmp/map-deps/node_modules/leaflet/dist/images shore-map/assets/images
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify published catch database
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -e
          for i in 1 2 3 4 5 6; do
            if curl -fsSL --max-time 20 "${PAGE_URL%/}/data/catches.json?smoke=$(date +%s)" -o /tmp/catches.json; then
              if python3 - <<'PY'
          import json
          from pathlib import Path
          j=json.loads(Path("/tmp/catches.json").read_text(encoding="utf-8"))
          rows=j.get("catches",[])
          assert isinstance(rows,list) and rows, "published catches are empty"
          assert j.get("updated_at"), "published updated_at missing"
          print("published catches", len(rows), "updated", j["updated_at"])
          PY
              then
                exit 0
              fi
            fi
            sleep 5
          done
          echo "Published catch database verification failed" >&2
          exit 1
