<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#102d42"><title>岸釣り海図マップ | 岡ちゃん</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif;color:#19394a}button,input,select{font:inherit}button{cursor:pointer;touch-action:manipulation}button:focus-visible,input:focus-visible{outline:3px solid #00afd3;outline-offset:2px}
header{height:auto;position:absolute;z-index:20;top:0;left:0;right:0;background:#112f44;color:white;padding:calc(7px + env(safe-area-inset-top)) 10px 8px;box-shadow:0 2px 14px #1238}h1{font-size:17px;margin:0 0 7px;display:flex;align-items:center;gap:7px}h1 small{font-size:10px;font-weight:500;color:#b4d4e0}.places{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}.places button{color:#e6f8ff;background:#ffffff14;border:1px solid #ffffff42;padding:7px 12px;border-radius:20px;white-space:nowrap;font-size:12px}
#map{position:absolute;inset:0;overflow:hidden;background:#d4e3dd;touch-action:none;cursor:grab}#map.drag{cursor:grabbing}.tiles{position:absolute;inset:0;pointer-events:none;overflow:hidden}.tiles img{position:absolute;display:block;max-width:none;user-select:none;-webkit-user-drag:none}.tiles.base{z-index:1}.tiles.coast{z-index:2}.tiles.sea{z-index:3}.markers{position:absolute;inset:0;z-index:5;pointer-events:none}.marker{position:absolute;pointer-events:auto;transform:translate(-50%,-100%);background:#e45142;border:2px solid white;color:white;border-radius:50% 50% 45% 45%;padding:6px 9px;min-width:33px;min-height:32px;font-size:12px;font-weight:800;box-shadow:0 2px 10px #1239}.marker span{position:absolute;top:0;left:calc(100% + 3px);background:#123d54ec;border-radius:5px;padding:3px 5px;white-space:nowrap;max-width:120px;overflow:hidden;text-overflow:ellipsis}#line{position:absolute;inset:0;z-index:4;pointer-events:none;width:100%;height:100%}.cross{position:absolute;z-index:6;top:50%;left:50%;width:20px;height:20px;transform:translate(-50%,-50%);pointer-events:none}.cross:before,.cross:after{content:"";position:absolute;background:#f8fcff;box-shadow:0 0 2px #002a3c;left:9px;top:0;width:2px;height:20px}.cross:after{transform:rotate(90deg)}
.tools{position:absolute;z-index:12;right:9px;top:calc(108px + env(safe-area-inset-top));display:grid;gap:7px}.tools button{width:44px;height:44px;background:#fffef7;border:1px solid #b8d3dc;border-radius:12px;font-size:22px;color:#15506a;box-shadow:0 2px 9px #1233}.tools button.active{background:#157c9a;color:white}
#notice{position:absolute;z-index:9;top:calc(110px + env(safe-area-inset-top));left:10px;max-width:min(72vw,360px);font-size:11px;background:#fffdf2ed;border:1px solid #e8d7a8;border-radius:9px;padding:7px 9px;line-height:1.45;pointer-events:none}
#coords{position:absolute;z-index:10;bottom:calc(173px + env(safe-area-inset-bottom));left:8px;background:#fffffff0;padding:7px 9px;border-radius:10px;font-size:11px;box-shadow:0 2px 7px #1233}.gsi{position:absolute;z-index:7;bottom:calc(155px + env(safe-area-inset-bottom));right:0;font-size:9px;background:#ffffffcf;padding:3px 5px}.gsi a{color:#164960}
.panel{position:absolute;z-index:18;bottom:0;left:0;right:0;border-radius:18px 18px 0 0;background:#f9fcfc;box-shadow:0 -4px 18px #1234;padding:11px 13px calc(13px + env(safe-area-inset-bottom));max-height:58vh;overflow-y:auto}#panel-title{display:flex;justify-content:space-between;align-items:center;gap:5px;font-weight:800;font-size:14px}#toggle-panel{border:0;background:#e4eff2;color:#164f69;border-radius:9px;padding:4px 11px}.panel.fold #panel-content{display:none}.switches{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}.switches button{border:1px solid #b9d4dc;border-radius:10px;padding:9px 5px;background:white;color:#315766;font-size:12px;font-weight:750}.switches button.active{background:#d8f0f6;color:#075a78;border-color:#138caf}label.line-label{display:flex;gap:7px;align-items:center;font-size:12px;font-weight:700;margin:10px 0}input[type=checkbox]{width:19px;height:19px;accent-color:#11859e}input[type=range]{width:100%;accent-color:#0680a0}.sub{font-size:11px;color:#55737b;line-height:1.5}.actions{display:flex;gap:7px;margin:8px 0}.actions button{flex:1;min-height:40px;background:#137d9b;color:white;border:0;border-radius:10px;font-size:12px;font-weight:750}.actions button.alt{background:#e5eff2;color:#155c75}.points{max-height:140px;overflow:auto}.point{display:flex;gap:5px;align-items:center;justify-content:space-between;border-top:1px solid #dae6e9;padding:6px 0;font-size:12px}.point button{border:1px solid #c8dce0;border-radius:7px;padding:5px 8px;background:white;color:#195d76}#distance{font-size:12px;font-weight:750;color:#065f7e}.hide{display:none!important}@media(min-width:780px){.panel{left:auto;width:370px;right:10px;bottom:10px;border-radius:18px}.tools{right:18px}#coords{bottom:17px}}
</style></head><body>
<div id="map" aria-label="地図。指で移動、二本指または右のボタンで拡大縮小"><div id="base" class="tiles base"></div><div id="coast" class="tiles coast"></div><div id="sea" class="tiles sea"></div><svg id="line"></svg><div id="markers" class="markers"></div><div class="cross"></div></div>
<header><h1>🌊 岸釣り海図マップ <small>v1.0</small></h1><div class="places"><button data-place="obama">小浜</button><button data-place="maizuru">舞鶴</button><button data-place="tsunekami">常神</button><button data-place="takahama">高浜</button><button data-place="echizen">越前</button></div></header>
<div class="tools"><button id="plus" aria-label="拡大">＋</button><button id="minus" aria-label="縮小">−</button><button id="gps" aria-label="現在地">◎</button><button id="ruler" aria-label="距離測定">↔</button></div>
<div id="notice" role="status">地図を読み込んでいます…</div>
<div id="coords">地図を起動中…</div>
<div class="gsi">地図・空中写真・沿岸資料：<a href="https://maps.gsi.go.jp/development/ichiran.html" target="_blank" rel="noopener">国土地理院</a> / 航路標識：<a href="https://www.openseamap.org/" target="_blank" rel="noopener">OpenSeaMap</a></div>
<section class="panel" id="panel"><div id="panel-title"><span>🗺️ 地図・岸際の情報</span><button id="toggle-panel" aria-label="パネルを開閉">閉じる ▾</button></div><div id="panel-content"><div class="switches"><button id="standard">標準地図</button><button id="photo" class="active">航空写真</button></div>
<label class="line-label"><input id="depth-on" type="checkbox" checked>沿岸調査図（水深線・底質など）</label><label class="line-label"><input id="seamark-on" type="checkbox">航路標識（※水深ではない）</label>
<div class="sub">沿岸調査図の透明度：<strong id="opacity-value">65%</strong></div><input id="opacity" type="range" min="10" max="100" value="65" aria-label="沿岸調査図の濃さ">
<div class="sub">※沿岸調査図は調査済み地域・縮尺に限り表示。色や線が出ない場所に水深データがあるとは限らない。地図を拡大しても測量精度は上がらないで。</div>
<div class="actions"><button id="save">＋ 中心を保存</button><button id="export" class="alt">ポイント書出し</button></div>
<div id="distance">↔ 距離を測る場合は右側の ↔ を押す</div><div id="points" class="points"></div>
</div></section>
<script>
(function(){
'use strict';
var $=function(id){return document.getElementById(id);};
var PLACES={obama:[35.505,135.747],maizuru:[35.505,135.362],tsunekami:[35.616,135.758],takahama:[35.494,135.561],echizen:[35.952,135.962]};
var state={lat:35.505,lon:135.747,z:15,mode:'photo',depth:true,seamark:false,alpha:.65,measure:false,ends:[],pts:[]};
try{state.pts=JSON.parse(localStorage.getItem('oka-shore-points-v1')||'[]');if(!Array.isArray(state.pts))state.pts=[];}catch(e){state.pts=[];}
var tiles={base:{},coast:{},sea:{}};var pointers=new Map();var dragOrigin=null;var moved=false;var firstBase=false;var renderQueued=false;
function px(lat,lon,z){var s=256*Math.pow(2,z),sin=Math.sin(Math.max(-85.0511,Math.min(85.0511,lat))*Math.PI/180);return {x:(lon+180)/360*s,y:(.5-Math.log((1+sin)/(1-sin))/(4*Math.PI))*s};}
function ll(x,y,z){var s=256*Math.pow(2,z),n=Math.PI*(1-2*y/s);return {lat:180/Math.PI*Math.atan(Math.sinh(n)),lon:((x/s*360+180)%360+360)%360-180};}
function viewport(){return {w:$('map').clientWidth,h:$('map').clientHeight};}
function fromScreen(x,y){var c=px(state.lat,state.lon,state.z),v=viewport();return ll(c.x+x-v.w/2,c.y+y-v.h/2,state.z);}
function toScreen(lat,lon){var c=px(state.lat,state.lon,state.z),p=px(lat,lon,state.z),v=viewport(),s=256*Math.pow(2,state.z),dx=p.x-c.x;if(dx>s/2)dx-=s;if(dx< -s/2)dx+=s;return {x:v.w/2+dx,y:v.h/2+p.y-c.y};}
function note(s){$('notice').textContent=s;$('notice').classList.remove('hide');}
function schedule(){if(renderQueued)return;renderQueued=true;requestAnimationFrame(function(){renderQueued=false;draw();});}
function clearTiles(group){Object.keys(tiles[group]).forEach(function(k){tiles[group][k].remove();});tiles[group]={};}
function drawTiles(group,z,source,visible){if(!visible){clearTiles(group);return;}var el=$(group),dict=tiles[group],p=px(state.lat,state.lon,state.z),v=viewport(),zoom=Math.min(z,state.z),scale=Math.pow(2,state.z-zoom),size=256*scale,n=Math.pow(2,zoom),left=p.x-v.w/2,top=p.y-v.h/2;var minX=Math.floor(left/size)-1,maxX=Math.ceil((left+v.w)/size)+1,minY=Math.max(0,Math.floor(top/size)-1),maxY=Math.min(n-1,Math.ceil((top+v.h)/size)+1);var shown={};
for(var y=minY;y<=maxY;y++)for(var x=minX;x<=maxX;x++){var xx=((x%n)+n)%n,k=zoom+'/'+xx+'/'+y,im=dict[k];shown[k]=true;if(!im){im=document.createElement('img');im.alt='';im.draggable=false;im.decoding='async';im.dataset.key=k;im.style.opacity=group==='coast'?state.alpha:1;var url=source(zoom,xx,y);im.src=url;dict[k]=im;el.appendChild(im);
if(group==='base'){im.onload=function(){if(!firstBase){firstBase=true;note('地図を表示中。岸際の調査図は対象海域でのみ重なるで。');setTimeout(function(){$('notice').classList.add('hide');},4800);}};im.onerror=function(){if(state.mode==='photo'&&!this.dataset.fallback){this.dataset.fallback='1';this.src='https://cyberjapandata.gsi.go.jp/xyz/std/'+this.dataset.key+'.png';}else{this.style.display='none';if(!firstBase)note('地図画像を取得できません。通信を確認してChromeで開いてな。');}};}
if(group==='coast'){im.onerror=function(){if(!this.dataset.fallback){this.dataset.fallback='1';this.src='https://cyberjapandata.gsi.go.jp/xyz/ccm2/'+this.dataset.key+'.png';}else{this.style.display='none';}};}
if(group==='sea'){im.onerror=function(){this.style.display='none';};}
}im.style.width=size+'px';im.style.height=size+'px';im.style.left=(x*size-left)+'px';im.style.top=(y*size-top)+'px';if(group==='coast')im.style.opacity=state.alpha;
}Object.keys(dict).forEach(function(k){if(!shown[k]){dict[k].remove();delete dict[k];}});
}
function distance(a,b){var r=6371000,t1=a.lat*Math.PI/180,t2=b.lat*Math.PI/180,dt=(b.lat-a.lat)*Math.PI/180,dl=(b.lon-a.lon)*Math.PI/180;var v=Math.sin(dt/2)**2+Math.cos(t1)*Math.cos(t2)*Math.sin(dl/2)**2;return 2*r*Math.atan2(Math.sqrt(v),Math.sqrt(1-v));}
function distText(n){return n<1000?Math.round(n)+' m':(n/1000).toFixed(2)+' km';}
function drawOver(){var mark=$('markers');mark.textContent='';state.pts.forEach(function(pt,i){var p=toScreen(pt.lat,pt.lon);if(p.x< -130||p.x>viewport().w+130||p.y< -50||p.y>viewport().h+60)return;var b=document.createElement('button');b.className='marker';b.style.left=p.x+'px';b.style.top=p.y+'px';b.textContent='★';var label=document.createElement('span');label.textContent=pt.name;b.appendChild(label);b.addEventListener('pointerdown',function(e){e.stopPropagation();});b.addEventListener('click',function(e){e.stopPropagation();jump(pt.lat,pt.lon);note(pt.name+'：保存したポイントへ移動');});mark.appendChild(b);});var s=$('line');s.textContent='';if(state.ends.length){var ns='http://www.w3.org/2000/svg';state.ends.forEach(function(pt){var p=toScreen(pt.lat,pt.lon),c=document.createElementNS(ns,'circle');c.setAttribute('cx',p.x);c.setAttribute('cy',p.y);c.setAttribute('r','6');c.setAttribute('fill','#ff8d24');c.setAttribute('stroke','white');c.setAttribute('stroke-width','2');s.appendChild(c);});if(state.ends.length===2){var a=toScreen(state.ends[0].lat,state.ends[0].lon),b=toScreen(state.ends[1].lat,state.ends[1].lon),line=document.createElementNS(ns,'line');line.setAttribute('x1',a.x);line.setAttribute('y1',a.y);line.setAttribute('x2',b.x);line.setAttribute('y2',b.y);line.setAttribute('stroke','#ff7b00');line.setAttribute('stroke-width','3');line.setAttribute('stroke-dasharray','7 5');s.insertBefore(line,s.firstChild);}}}
function draw(){var baseSource=function(z,x,y){return 'https://cyberjapandata.gsi.go.jp/xyz/'+(state.mode==='photo'?'seamlessphoto':'std')+'/'+z+'/'+x+'/'+y+(state.mode==='photo'?'.jpg':'.png');};drawTiles('base',state.z,baseSource,true);drawTiles('coast',16,function(z,x,y){return 'https://cyberjapandata.gsi.go.jp/xyz/ccm1/'+z+'/'+x+'/'+y+'.png';},state.depth&&state.z>=14);drawTiles('sea',state.z,function(z,x,y){return 'https://tiles.openseamap.org/seamark/'+z+'/'+x+'/'+y+'.png';},state.seamark);$('coords').textContent='中心：'+state.lat.toFixed(5)+'°, '+state.lon.toFixed(5)+'°  /  拡大 '+state.z;drawOver();}
function jump(lat,lon,z){state.lat=lat;state.lon=lon;if(z!==undefined)state.z=z;draw();}
function zoom(delta){var target=Math.max(7,Math.min(18,state.z+delta));if(target===state.z)return;state.z=target;Object.keys(tiles).forEach(clearTiles);if(state.mode==='photo'&&state.z<14){state.mode='standard';$('standard').classList.add('active');$('photo').classList.remove('active');note('この縮尺では標準地図に切り替えたで。');}draw();}
$('plus').onclick=function(){zoom(1);};$('minus').onclick=function(){zoom(-1);};
document.querySelectorAll('[data-place]').forEach(function(b){b.onclick=function(){var a=PLACES[b.dataset.place];jump(a[0],a[1],15);};});
function mode(m){state.mode=m;if(m==='photo'&&state.z<14)state.z=14;clearTiles('base');$('standard').classList.toggle('active',m==='standard');$('photo').classList.toggle('active',m==='photo');draw();}
$('standard').onclick=function(){mode('standard');};$('photo').onclick=function(){mode('photo');};
$('depth-on').onchange=function(){state.depth=this.checked;draw();if(this.checked)note('沿岸の調査図は整備済みの場所だけ表示されるで。');};
$('seamark-on').onchange=function(){state.seamark=this.checked;draw();};
$('opacity').oninput=function(){state.alpha=this.value/100;$('opacity-value').textContent=this.value+'%';$('coast').style.opacity=1;Object.values(tiles.coast).forEach(function(im){im.style.opacity=state.alpha;});};
$('toggle-panel').onclick=function(){var f=$('panel').classList.toggle('fold');this.textContent=f?'開く ▴':'閉じる ▾';};
$('gps').onclick=function(){if(!navigator.geolocation){note('この環境では現在地を利用できません。');return;}note('現在地を確認しています…');navigator.geolocation.getCurrentPosition(function(pos){jump(pos.coords.latitude,pos.coords.longitude,16);note('現在地へ移動したで。');},function(e){note('現在地を取得できません：端末の位置情報の許可を確認してな。');},{enableHighAccuracy:true,timeout:12000,maximumAge:30000});};
$('ruler').onclick=function(){state.measure=!state.measure;state.ends=[];this.classList.toggle('active',state.measure);$('distance').textContent=state.measure?'地図上の始点と終点を順番にタップ':'↔ 距離を測る場合は右側の ↔ を押す';drawOver();if(state.measure){$('panel').classList.add('fold');$('toggle-panel').textContent='開く ▴';note('地図を2か所タップすると距離を計測するで。');}};
function savePoints(){try{localStorage.setItem('oka-shore-points-v1',JSON.stringify(state.pts));return true;}catch(e){note('端末の保存が制限されています。Chromeで開いてな。');return false;}}
$('save').onclick=function(){var name=prompt('ポイント名を入力してな（地図の中心を保存）','釣りポイント '+(state.pts.length+1));if(name===null||!name.trim())return;state.pts.push({name:name.trim().slice(0,60),lat:state.lat,lon:state.lon});savePoints();points();drawOver();note('ポイントを端末に保存したで。GitHubには送信してへん。');};
function points(){var el=$('points');el.textContent='';if(!state.pts.length){el.textContent='まだポイントは保存されていません。';return;}state.pts.forEach(function(pt,i){var d=document.createElement('div');d.className='point';var name=document.createElement('span');name.textContent=pt.name;var go=document.createElement('button');go.textContent='移動';go.onclick=function(){jump(pt.lat,pt.lon,16);};var del=document.createElement('button');del.textContent='削除';del.onclick=function(){if(confirm('「'+pt.name+'」を削除する？')){state.pts.splice(i,1);savePoints();points();drawOver();}};d.appendChild(name);d.appendChild(go);d.appendChild(del);el.appendChild(d);});}
$('export').onclick=function(){if(!state.pts.length){note('書き出すポイントがないで。');return;}var rows=['name,latitude,longitude'].concat(state.pts.map(function(p){return '"'+p.name.replace(/"/g,'""')+'",'+p.lat+','+p.lon;}));var blob=new Blob(['\ufeff'+rows.join('\r\n')],{type:'text/csv;charset=utf-8'});var url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='shore-points.csv';document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(url);},1000);};
var map=$('map');
map.addEventListener('pointerdown',function(e){if(e.button!==0&&e.pointerType==='mouse')return;map.setPointerCapture(e.pointerId);pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});if(pointers.size===1){dragOrigin={x:e.clientX,y:e.clientY,center:px(state.lat,state.lon,state.z)};moved=false;map.classList.add('drag');}else{dragOrigin=null;}});
map.addEventListener('pointermove',function(e){if(!pointers.has(e.pointerId))return;var old=pointers.get(e.pointerId);pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});if(pointers.size===1&&dragOrigin){var dx=e.clientX-dragOrigin.x,dy=e.clientY-dragOrigin.y;if(Math.abs(dx)+Math.abs(dy)>7)moved=true;var n=ll(dragOrigin.center.x-dx,dragOrigin.center.y-dy,state.z);state.lat=Math.max(-85,Math.min(85,n.lat));state.lon=n.lon;schedule();}else if(pointers.size===2){var a=Array.from(pointers.values()),newD=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);if(old&&newD>0){if(!map.dataset.pinch){map.dataset.pinch=String(newD);}var ratio=newD/Number(map.dataset.pinch);if(ratio>1.4){zoom(1);map.dataset.pinch=String(newD);}else if(ratio<.72){zoom(-1);map.dataset.pinch=String(newD);}}moved=true;}});
map.addEventListener('pointerup',function(e){if(!pointers.has(e.pointerId))return;pointers.delete(e.pointerId);if(!pointers.size){map.classList.remove('drag');delete map.dataset.pinch;if(!moved&&state.measure){var b=map.getBoundingClientRect(),pt=fromScreen(e.clientX-b.left,e.clientY-b.top);if(state.ends.length===2)state.ends=[];state.ends.push(pt);if(state.ends.length===2){$('distance').textContent='計測結果：'+distText(distance(state.ends[0],state.ends[1]));note('2点間：'+distText(distance(state.ends[0],state.ends[1])));}else{$('distance').textContent='終点をタップしてな';note('終点をタップしてな。');}drawOver();}}});
map.addEventListener('pointercancel',function(e){pointers.delete(e.pointerId);map.classList.remove('drag');delete map.dataset.pinch;});
map.addEventListener('wheel',function(e){e.preventDefault();zoom(e.deltaY<0?1:-1);},{passive:false});
window.addEventListener('resize',schedule);
window.addEventListener('error',function(e){if(!firstBase)note('起動中にエラーが発生しました。Chromeで再読み込みしてな。');});
setTimeout(function(){if(!firstBase)note('地図の読み込みが遅れています。ネット接続とChromeでの表示を確認してな。');},7000);
points();draw();
})();
</script></body></html>
