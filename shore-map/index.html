<script>

var map,standard,photo,coastNew,coastOld,shoreMark,ring,depthGroup,lastPoint,site='obama',shore=null,range=500,showCoast=false,base='photo',pickShore=true,loaded=0,failed=0,tileTimer=0,records=[];

function km(m){return m>=1000?(m/1000).toFixed(2)+'km':Math.round(m)+'m';}

function updateRange(){document.querySelectorAll('[data-range]').forEach(function(b){b.classList.toggle('active',Number(b.dataset.range)===range);});if(ring)ring.setRadius(range);drawDepths();updateHud();if(shore)map.fitBounds(ring.getBounds(),{paddingTopLeft:[15,75],paddingBottomRight:[60,112],maxZoom:17,animate:false});}
function chooseShore(latlng){shore=L.latLng(latlng);if(shoreMark)map.removeLayer(shoreMark);if(ring)map.removeLayer(ring);shoreMark=L.marker(shore,{icon:L.divIcon({className:'',html:'<div class="shore-dot"></div>',iconSize:[28,28],iconAnchor:[14,28]}),zIndexOffset:750}).addTo(map).bindPopup('ここが釣り座。<br>距離はここから測るで。');ring=L.circle(shore,{radius:range,color:'#fdb22a',weight:2,dashArray:'6 5',fillColor:'#f7b531',fillOpacity:.045,interactive:false}).addTo(map);pickShore=false;$('setShore').classList.remove('active');updateRange();message('釣り座を設定したで。海をタップすると岸からの距離が出る。',4200);}
function makeDepthIcon(p){var c=p.source==='推定'?'depth-pin estimated':'depth-pin';return L.divIcon({className:'',html:'<div class="'+c+'">'+p.depth+'m</div>',iconSize:[42,24],iconAnchor:[21,12]});}

function pointForm(latlng){if(!latlng){message('地図の記録地点をタップしてから「水深記録」を押してな。',4200);return;}closeSheet();showSheet('水深を記録する');var body=$('sheetBody');
text('p','登録地点：'+latlng.lat.toFixed(6)+', '+latlng.lng.toFixed(6),body);
var nameLabel=text('label','場所・目印',body),name=document.createElement('input');name.placeholder='例：堤防の先端から60m';name.maxLength=70;body.appendChild(name);
text('label','水深（m）',body);var d=document.createElement('input');d.type='number';d.step='0.1';d.min='0';d.max='500';d.inputMode='decimal';d.placeholder='例：8.5';body.appendChild(d);
text('label','情報の種類',body);var src=document.createElement('select');['魚探などで実測','資料から転記','推定'].forEach(function(s){var o=document.createElement('option');o.textContent=s;o.value=s;src.appendChild(o);});body.appendChild(src);
var w=text('div','魚探・資料による水深でも本人が入力した値として保存。公式の実測値と混同しないでな。',body);w.className='warning';
btn('この地点を保存',body,function(){var n=Number(d.value);if(!d.value.trim()||!isFinite(n)||n<0||n>500){message('水深は0〜500mの数値を入力してな。');return;}if(records.length>=500){message('記録は500件まで。CSVに書き出して整理してな。');return;}records.push({lat:latlng.lat,lon:latlng.lng,depth:Math.round(n*10)/10,source:src.value,name:name.value.trim().slice(0,70),date:new Date().toISOString().slice(0,10)});save();drawDepths();closeSheet();message('水深をこの端末に保存したで。GitHubには送信してへん。',4500);},'action');
}
function openPoints(){showSheet('保存した水深記録');var body=$('sheetBody');if(lastPoint)btn('＋ 最後に選んだ地点の水深を記録',body,function(){pointForm(lastPoint);},'action');if(!records.length){text('p','まだ記録はないで。地図をタップして、水深記録から追加できる。',body);}records.forEach(function(p,i){var box=document.createElement('div');box.className='item';var left=document.createElement('div');text('b',p.depth+'m  '+(p.name||'名称なし'),left);text('span',p.source+' / '+p.date,left);box.appendChild(left);btn('移動',box,function(){closeSheet();map.setView([p.lat,p.lon],17);lastPoint=L.latLng(p.lat,p.lon);updateHud(lastPoint);});btn('削除',box,function(){if(!confirm('この記録を削除する？'))return;records.splice(i,1);save();drawDepths();openPoints();});body.appendChild(box);});
var bar=document.createElement('div');bar.style.cssText='display:flex;gap:8px;flex-wrap:wrap;margin-top:12px';body.appendChild(bar);btn('CSVを書き出す',bar,exportCsv,'action');}
function csvCell(v){var t=String(v===null||v===undefined?'':v);if(/^[=+\-@]/.test(t))t="'"+t;return '"'+t.replace(/"/g,'""')+'"';}
function exportCsv(){if(!records.length){message('まだ記録がないで。');return;}var lines=['latitude,longitude,depth_m,source,name,date'].concat(records.map(function(p){return [p.lat,p.lon,p.depth,p.source,p.name,p.date].map(csvCell).join(',');}));var blob=new Blob(['\ufeff'+lines.join('\r\n')],{type:'text/csv;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='oka-shore-depths.csv';document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(url);},6000);}
function openInfo(){showSheet('表示設定・データの説明');var body=$('sheetBody');
text('h3','海底の資料',body);
text('p','「深」ボタンで国土地理院の沿岸海域土地条件図を重ねる。平成元年以降・昭和63年以前の2系統。ズーム14～16までの公開データを表示し、それ以上は拡大表示。対象地域に資料がない場合は空欄。',body);
var on=document.createElement('label');var c=document.createElement('input');c.type='checkbox';c.checked=showCoast;c.style.cssText='display:inline;width:auto;min-height:auto;margin-right:8px';c.onchange=function(){setCoast(c.checked);};on.appendChild(c);on.appendChild(document.createTextNode('沿岸調査図を表示'));body.appendChild(on);
text('label','資料の濃さ',body);var slider=document.createElement('input');slider.type='range';slider.min='15';slider.max='100';slider.value=String(Math.round((coastNew.options.opacity||.64)*100));slider.oninput=function(){coastNew.setOpacity(Number(this.value)/100);coastOld.setOpacity(Number(this.value)/100);};body.appendChild(slider);
var warn=text('div','重要：航空写真の海の色だけでは正確な水深は判断できません。沿岸調査図もすべての海域を収録しておらず、浅場や沈み根の有無を保証しません。測量年月にも注意。船の航行には最新の公式海図を使用してください。',body);warn.className='warning';
text('h3','公式の資料を確認',body);
[['海しる（海上保安庁）','https://www.msil.go.jp/'],['国土地理院・地理院タイル一覧','https://maps.gsi.go.jp/development/ichiran.html'],['日本水路協会 new pec','https://www.jha.or.jp/jp/shop/products/newpec/']].forEach(function(a){var p=text('p','',body),link=document.createElement('a');link.href=a[1];link.target='_blank';link.rel='noopener';link.textContent=a[0]+' ↗';p.appendChild(link);});
text('h3','岸からの範囲',body);text('p','300m・500m・1kmは、指定した釣り座からの半径。保存した水深記録をその範囲に絞る。航空写真と資料は地図の表示範囲全体を閲覧できる。',body);
text('h3','プライバシー',body);text('p','釣り座・水深記録はブラウザ内だけに保存。GitHubへ送らない。ブラウザのサイトデータを消すと記録も消えるため、CSVでバックアップしてな。',body);}
function setCoast(on){showCoast=on;loaded=0;failed=0;clearTimeout(tileTimer);['coast'].forEach(function(){[coastOld,coastNew].forEach(function(layer){if(on){if(!map.hasLayer(layer))layer.addTo(map);}else if(map.hasLayer(layer))map.removeLayer(layer);});});$('coast').classList.toggle('active',on);updateHud();if(on){message('沿岸調査図を照会中。データのある地域だけ表示。水深が確認できなければ空欄のままやで。',4500);tileTimer=setTimeout(function(){if(!showCoast)return;if(!loaded)message('この画面では沿岸調査図を取得できていません。未整備か通信の問題があるで。',6500);updateHud();},4200);}}
function ready(){if(typeof L==='undefined'){$('fallback').style.display='block';$('notice').hidden=true;return;}
map=L.map('map',{zoomControl:false,preferCanvas:true,zoomSnap:1,minZoom:7,maxZoom:19,worldCopyJump:false}).setView(sites.obama,16);
standard=L.tileLayer('https://cyberjapandata.gsi.go.jp/xyz/std/{z}/{x}/{y}.png',{minZoom:5,maxZoom:19,maxNativeZoom:18,attribution:'<a href="https://maps.gsi.go.jp/development/ichiran.html" target="_blank" rel="noopener">国土地理院</a>',keepBuffer:1}).addTo(map);
photo=L.tileLayer('https://cyberjapandata.gsi.go.jp/xyz/seamlessphoto/{z}/{x}/{y}.jpg',{minZoom:14,maxNativeZoom:18,maxZoom:19,attribution:'国土地理院（空中写真）',keepBuffer:1}).addTo(map);
standard.on('tileload',function(){$('notice').hidden=true;});photo.on('tileload',function(){$('notice').hidden=true;});
standard.on('tileerror',function(){message('地図の読み込みに失敗しました。通信を確認してな。',5000);});
map.createPane('coastOld');map.getPane('coastOld').style.zIndex=460;map.getPane('coastOld').style.pointerEvents='none';
map.createPane('coastNew');map.getPane('coastNew').style.zIndex=465;map.getPane('coastNew').style.pointerEvents='none';
function events(layer){layer.on('tileload',function(){loaded++;updateHud();});layer.on('tileerror',function(){failed++;updateHud();});}
coastOld=L.tileLayer('https://cyberjapandata.gsi.go.jp/xyz/ccm2/{z}/{x}/{y}.png',{pane:'coastOld',minZoom:14,maxNativeZoom:16,maxZoom:19,opacity:.64,keepBuffer:0});coastNew=L.tileLayer('https://cyberjapandata.gsi.go.jp/xyz/ccm1/{z}/{x}/{y}.png',{pane:'coastNew',minZoom:14,maxNativeZoom:16,maxZoom:19,opacity:.64,keepBuffer:0});events(coastOld);events(coastNew);
depthGroup=L.layerGroup().addTo(map);
$('region').onchange=function(){site=this.value;map.setView(sites[site],16);if(shoreMark)map.removeLayer(shoreMark);if(ring)map.removeLayer(ring);shoreMark=null;ring=null;shore=null;lastPoint=null;pickShore=true;drawDepths();updateHud();message('岸の釣り座を地図上でタップして指定してな。',5500);};
$('base').onclick=function(){base=base==='photo'?'standard':'photo';if(base==='photo'){if(map.getZoom()<14)map.setZoom(14);photo.addTo(map);this.textContent='写真';this.classList.add('selected');}else{map.removeLayer(photo);this.textContent='地図';this.classList.remove('selected');}depthGroup.bringToFront&&depthGroup.bringToFront();};
